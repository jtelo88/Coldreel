[project]
name = "coldreel"
version = "0.1.0"
description = "Visor web sobre el respaldo del NVR de UniFi Protect: linea de tiempo por particiones y reproduccion MP4 bajo demanda desde los .ubv crudos"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
coldreel = "coldreel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
